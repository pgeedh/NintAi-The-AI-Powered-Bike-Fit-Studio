<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#studioBg)" />

  <!-- Studio Top Bar -->
  <rect x="0" y="0" width="1280" height="52" fill="#0b0e15" stroke="#1c2333" stroke-width="1" />
  
  <g transform="translate(24, 13)">
    <rect width="26" height="26" rx="6" fill="#2563eb" />
    <text x="13" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">NintAi Studio <tspan font-family="monospace" font-size="11" font-weight="500" fill="#64748b">v2.0</tspan></text>
  </g>

  <!-- Top Bar Source Status -->
  <g transform="translate(520, 14)">
    <rect x="0" y="0" width="240" height="24" rx="5" fill="#121620" stroke="#1e2535" stroke-width="1" />
    <text x="12" y="16" font-family="monospace" font-size="11" fill="#94a3b8">Source: <tspan fill="#38bdf8">testvideo2.mp4 (TT Video)</tspan></text>
  </g>

  <!-- Top Bar Actions -->
  <g transform="translate(1040, 13)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#151b27" stroke="#222b3e" stroke-width="1" />
    <text x="40" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">⚡ AI Ready</text>

    <rect x="90" y="0" width="120" height="26" rx="6" fill="#2563eb" />
    <text x="150" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Export Report</text>
  </g>

  <!-- Left Sidebar (Control Rail) -->
  <g transform="translate(24, 72)">
    <rect width="320" height="704" rx="14" fill="#0f131d" stroke="#1c2333" stroke-width="1" filter="url(#subtleShadow)" />
    
    <!-- Media Source Selector -->
    <g transform="translate(18, 20)">
      <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">MEDIA SOURCE</text>
      <text x="284" y="0" font-family="sans-serif" font-size="11" fill="#3b82f6" text-anchor="end">Upload file</text>

      <!-- Active Sample 1 -->
      <rect x="0" y="12" width="284" height="38" rx="8" fill="#17223b" stroke="#2563eb" stroke-width="1" />
      <text x="12" y="35" font-family="monospace" font-size="11" font-weight="600" fill="#ffffff">📹 testvideo2.mp4</text>
      <text x="272" y="35" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="end">VIDEO</text>

      <!-- Sample 2 -->
      <rect x="0" y="56" width="284" height="34" rx="8" fill="#121622" stroke="#1c2333" stroke-width="1" />
      <text x="12" y="77" font-family="monospace" font-size="11" fill="#94a3b8">📹 testvideo.mp4</text>
      <text x="272" y="77" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">VIDEO</text>

      <!-- Sample 3 -->
      <rect x="0" y="96" width="284" height="34" rx="8" fill="#121622" stroke="#1c2333" stroke-width="1" />
      <text x="12" y="117" font-family="monospace" font-size="11" fill="#94a3b8">🖼️ 1.jpg (Road Side)</text>
      <text x="272" y="117" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">IMAGE</text>
    </g>

    <!-- Discipline Segmented Control -->
    <g transform="translate(18, 180)">
      <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">DISCIPLINE</text>
      <rect x="0" y="12" width="284" height="32" rx="7" fill="#090c12" stroke="#1c2333" stroke-width="1" />
      
      <rect x="2" y="14" width="68" height="28" rx="5" fill="#121622" />
      <text x="36" y="32" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Endurance</text>
      
      <text x="105" y="32" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Race</text>

      <rect x="142" y="14" width="70" height="28" rx="5" fill="#1d2639" />
      <text x="177" y="32" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">TT / Tri</text>

      <text x="248" y="32" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Gravel</text>

      <text x="0" y="62" font-family="sans-serif" font-size="10.5" fill="#64748b">Aero bars, long steady efforts. Aero and sustainable.</text>
    </g>

    <!-- Calibration -->
    <g transform="translate(18, 275)">
      <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">CALIBRATION PARAMETERS</text>
      
      <rect x="0" y="12" width="136" height="30" rx="6" fill="#0b0e14" stroke="#1e2535" stroke-width="1" />
      <text x="10" y="31" font-family="monospace" font-size="11" fill="#cbd5e1">172.5 mm</text>

      <rect x="148" y="12" width="136" height="30" rx="6" fill="#0b0e14" stroke="#1e2535" stroke-width="1" />
      <text x="158" y="31" font-family="sans-serif" font-size="11" fill="#cbd5e1">RTMPose (Feet)</text>
    </g>

    <!-- Analyze Button -->
    <g transform="translate(18, 345)">
      <rect width="284" height="42" rx="8" fill="#2563eb" />
      <polygon points="108,360 118,366 108,372" fill="#ffffff" />
      <text x="148" y="370" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Analyze Biomechanics</text>
    </g>

    <!-- Fit Score Summary Card -->
    <g transform="translate(18, 415)">
      <rect width="284" height="80" rx="8" fill="#121824" stroke="#1c2538" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="80" stroke="#10b981" stroke-width="6" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">OVERALL FIT SCORE</text>
      <text x="16" y="62" font-family="monospace" font-size="28" font-weight="800" fill="#10b981">86 <tspan font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">/ 100</tspan></text>
      <rect x="210" y="32" width="60" height="20" rx="4" fill="#10b981" fill-opacity="0.15" />
      <text x="240" y="46" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">Optimal</text>
    </g>
  </g>

  <!-- Right Main Stage (Viewport & Kinematics) -->
  <g transform="translate(364, 72)">
    
    <!-- Viewport Screen (Aspect 16:9) -->
    <rect width="892" height="470" rx="14" fill="#040508" stroke="#1c2333" stroke-width="1" />
    
    <!-- Floating Telemetry HUD Chips -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0a0e16" fill-opacity="0.8" stroke="#1e2535" stroke-width="1" />
      <text x="10" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8">Knee BDC: <tspan font-family="monospace" font-weight="700" fill="#10b981">146.0°</tspan></text>

      <rect x="140" y="0" width="110" height="28" rx="6" fill="#0a0e16" fill-opacity="0.8" stroke="#1e2535" stroke-width="1" />
      <text x="150" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8">Hip Closed: <tspan font-family="monospace" font-weight="700" fill="#38bdf8">51.2°</tspan></text>
    </g>

    <g transform="translate(620, 16)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#0a0e16" fill-opacity="0.8" stroke="#1e2535" stroke-width="1" />
      <text x="10" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8">Cadence: <tspan font-family="monospace" font-weight="700" fill="#facc15">90 RPM</tspan></text>

      <rect x="130" y="0" width="120" height="28" rx="6" fill="#0a0e16" fill-opacity="0.8" stroke="#1e2535" stroke-width="1" />
      <text x="140" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8">KOPS: <tspan font-family="monospace" font-weight="700" fill="#34d399">+4 mm</tspan></text>
    </g>

    <!-- Simulated Cyclist Skeleton -->
    <g transform="translate(160, 60)">
      <!-- Head / Ear -->
      <circle cx="280" cy="90" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <line x1="280" y1="90" x2="310" y2="120" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />

      <!-- Arm -->
      <circle cx="310" cy="120" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <line x1="310" y1="120" x2="340" y2="175" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="340" cy="175" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <line x1="340" y1="175" x2="400" y2="200" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="400" cy="200" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

      <!-- Torso -->
      <line x1="310" y1="120" x2="220" y2="155" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="220" cy="155" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

      <!-- Leg -->
      <line x1="220" y1="155" x2="285" y2="235" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="285" cy="235" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <line x1="285" y1="235" x2="265" y2="315" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="265" cy="315" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

      <!-- Foot Triangle -->
      <polygon points="265,315 250,325 295,332" fill="#eab308" fill-opacity="0.3" stroke="#eab308" stroke-width="2" />
    </g>

    <!-- Timeline Scrubber Bar -->
    <g transform="translate(0, 484)">
      <rect width="892" height="48" rx="10" fill="#0f131d" stroke="#1c2333" stroke-width="1" />
      
      <!-- Play button -->
      <circle cx="24" cy="24" r="14" fill="#1b2335" />
      <polygon points="21,19 29,24 21,29" fill="#ffffff" />

      <text x="50" y="28" font-family="monospace" font-size="11" fill="#94a3b8">00:04.82</text>
      
      <!-- Slider Track -->
      <rect x="120" y="22" width="640" height="4" rx="2" fill="#1c2333" />
      <rect x="120" y="22" width="280" height="4" rx="2" fill="#3b82f6" />
      <circle cx="400" cy="24" r="7" fill="#ffffff" />

      <text x="874" y="28" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">Frame 74 / 204</text>
    </g>

    <!-- Bottom Inspector Panels (Kinematics & Prescriptions) -->
    <g transform="translate(0, 546)">
      
      <!-- Kinematics Card -->
      <rect x="0" y="0" width="436" height="158" rx="12" fill="#0f131d" stroke="#1c2333" stroke-width="1" />
      <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.04em">DYNAMIC KINEMATICS</text>
      <text x="420" y="22" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">MEDIANS (2D)</text>

      <!-- Row 1: Knee -->
      <g transform="translate(16, 36)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" fill="#cbd5e1">Knee Extension (BDC)</text>
        <text x="404" y="10" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">146.0° <tspan font-family="sans-serif" font-size="9" fill="#34d399">OPTIMAL</tspan></text>
        <rect x="0" y="16" width="404" height="4" rx="2" fill="#1e2535" />
        <rect x="140" y="16" width="100" height="4" rx="2" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.5" />
        <circle cx="205" cy="18" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Row 2: Hip -->
      <g transform="translate(16, 74)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" fill="#cbd5e1">Closed Hip Angle (TDC)</text>
        <text x="404" y="10" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">51.2° <tspan font-family="sans-serif" font-size="9" fill="#34d399">OPTIMAL</tspan></text>
        <rect x="0" y="16" width="404" height="4" rx="2" fill="#1e2535" />
        <rect x="120" y="16" width="90" height="4" rx="2" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.5" />
        <circle cx="165" cy="18" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Row 3: Torso -->
      <g transform="translate(16, 112)">
        <text x="0" y="10" font-family="sans-serif" font-size="11" fill="#cbd5e1">Torso vs Horizontal</text>
        <text x="404" y="10" font-family="monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">46.5° <tspan font-family="sans-serif" font-size="9" fill="#34d399">OPTIMAL</tspan></text>
        <rect x="0" y="16" width="404" height="4" rx="2" fill="#1e2535" />
        <rect x="130" y="16" width="110" height="4" rx="2" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.5" />
        <circle cx="185" cy="18" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Prescriptions & AI Coach Card -->
      <rect x="456" y="0" width="436" height="158" rx="12" fill="#0f131d" stroke="#1c2333" stroke-width="1" />
      <text x="472" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.04em">FIT PRESCRIPTIONS &amp; AI VERDICT</text>
      <text x="876" y="22" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="end">GEMINI 2.5</text>

      <g transform="translate(472, 36)">
        <rect width="404" height="32" rx="6" fill="#141a27" stroke="#1e2535" stroke-width="1" />
        <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#f8fafc">1. Saddle Height: <tspan fill="#34d399">Optimal (Keep height)</tspan></text>

        <rect y="40" width="404" height="68" rx="6" fill="#141a27" stroke="#1e2535" stroke-width="1" />
        <text x="10" y="58" font-family="sans-serif" font-size="10.5" fill="#94a3b8">"Leg extension at BDC is textbook at 146°. Reach is slightly</text>
        <text x="10" y="74" font-family="sans-serif" font-size="10.5" fill="#94a3b8">short; a 10mm longer stem will open the chest without</text>
        <text x="10" y="90" font-family="sans-serif" font-size="10.5" fill="#94a3b8">compromising pelvic rotation."</text>
      </g>

    </g>

  </g>
</svg>
