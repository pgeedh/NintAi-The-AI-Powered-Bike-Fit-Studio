<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08090D" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="800" fill="url(#studioBg)" />

  <!-- Studio Top Bar -->
  <rect x="0" y="0" width="1280" height="54" fill="#0A0D14" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
  
  <g transform="translate(24, 14)">
    <rect width="26" height="26" rx="7" fill="#2563EB" />
    <text x="13" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">NintAi Studio <tspan font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#64748B">v2.0 Pro</tspan></text>
  </g>

  <!-- Top Bar Source Status -->
  <g transform="translate(500, 14)">
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#0E121A" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Active: <tspan fill="#38BDF8">testvideo2.mp4 (Triathlon TT)</tspan></text>
  </g>

  <!-- Top Bar Actions -->
  <g transform="translate(1010, 14)">
    <rect x="0" y="0" width="68" height="26" rx="7" fill="#141924" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="34" y="17" font-family="sans-serif" font-size="11" font-weight="550" fill="#94A3B8" text-anchor="middle">Guide</text>

    <rect x="76" y="0" width="80" height="26" rx="7" fill="#141924" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="116" y="17" font-family="sans-serif" font-size="11" font-weight="550" fill="#10B981" text-anchor="middle">⚡ AI Ready</text>

    <rect x="164" y="0" width="102" height="26" rx="7" fill="#2563EB" />
    <text x="215" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Export PDF</text>
  </g>

  <!-- Left Sidebar (Control Rail) -->
  <g transform="translate(24, 72)">
    <rect width="320" height="688" rx="16" fill="#0E121A" stroke="rgba(255,255,255,0.07)" stroke-width="1" filter="url(#subtleShadow)" />
    
    <!-- Media Source Selector -->
    <g transform="translate(18, 20)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.06em">MEDIA SOURCE</text>
      <text x="284" y="0" font-family="sans-serif" font-size="11" fill="#3B82F6" font-weight="500" text-anchor="end">Upload file</text>

      <!-- Active Sample 1 -->
      <rect x="0" y="12" width="284" height="38" rx="8" fill="#17223B" stroke="#2563EB" stroke-width="1" />
      <text x="12" y="35" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF">📹 testvideo2.mp4</text>
      <text x="272" y="35" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="end">VIDEO</text>

      <!-- Sample 2 -->
      <rect x="0" y="56" width="284" height="34" rx="8" fill="#121622" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="12" y="77" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">📹 testvideo.mp4</text>
      <text x="272" y="77" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="end">VIDEO</text>

      <!-- Sample 3 -->
      <rect x="0" y="96" width="284" height="34" rx="8" fill="#121622" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="12" y="117" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">🖼️ 1.jpg (Road Side)</text>
      <text x="272" y="117" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="end">PHOTO</text>
    </g>

    <!-- Discipline Segmented Control -->
    <g transform="translate(18, 175)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.06em">DISCIPLINE TARGETS</text>
      
      <rect x="0" y="12" width="284" height="32" rx="9" fill="#090C12" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <rect x="142" y="14" width="70" height="28" rx="7" fill="#141924" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <text x="35" y="31" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Endurance</text>
      <text x="106" y="31" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Race</text>
      <text x="177" y="31" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">TT / Tri</text>
      <text x="248" y="31" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Gravel</text>

      <text x="0" y="60" font-family="sans-serif" font-size="11" fill="#94A3B8">Low aerodynamic drag, steep hip angle.</text>
    </g>

    <!-- Calibration -->
    <g transform="translate(18, 270)">
      <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.06em">CALIBRATION &amp; SOTA ENGINE</text>
      
      <g transform="translate(0, 12)">
        <rect width="138" height="36" rx="8" fill="#121622" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
        <text x="12" y="16" font-family="sans-serif" font-size="9" fill="#64748B">Crank Length</text>
        <text x="12" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F8FAFC">172.5 mm</text>

        <rect x="146" width="138" height="36" rx="8" fill="#121622" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
        <text x="158" y="16" font-family="sans-serif" font-size="9" fill="#64748B">Pose Engine</text>
        <text x="158" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8">RTMPose (26)</text>
      </g>
    </g>

    <!-- Analyze CTA Button -->
    <g transform="translate(18, 350)">
      <rect width="284" height="42" rx="10" fill="#2563EB" filter="url(#subtleShadow)" />
      <polygon points="108,16 108,26 117,21" fill="#FFFFFF" />
      <text x="152" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Analyze Biomechanics</text>
    </g>

    <!-- Fit Score Card -->
    <g transform="translate(18, 415)">
      <rect width="284" height="96" rx="12" fill="#0B0E15" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="96" stroke="#10B981" stroke-width="4" />
      
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">OVERALL FIT SCORE</text>
      <text x="268" y="36" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700" fill="#10B981" text-anchor="end">86</text>
      
      <line x1="16" y1="52" x2="268" y2="52" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <text x="16" y="74" font-family="sans-serif" font-size="11" fill="#64748B">Biomechanics Alignment</text>
      <rect x="210" y="60" width="58" height="20" rx="5" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <text x="239" y="74" font-family="sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">Optimal</text>
    </g>
  </g>

  <!-- Right Stage (Video Viewport & Kinematics) -->
  <g transform="translate(368, 72)">
    <!-- Video Stage 16:9 Viewport -->
    <rect width="888" height="420" rx="16" fill="#040508" stroke="rgba(255,255,255,0.07)" stroke-width="1" filter="url(#subtleShadow)" />
    
    <!-- Skeleton & Cyclist Mock Graphics -->
    <g transform="translate(260, 60)">
      <!-- Bike Frame Lines (Subtle Gray) -->
      <line x1="90" y1="210" x2="190" y2="90" stroke="#334155" stroke-width="3" />
      <line x1="190" y1="90" x2="280" y2="120" stroke="#334155" stroke-width="3" />
      <line x1="190" y1="90" x2="180" y2="230" stroke="#334155" stroke-width="3" />
      <line x1="90" y1="210" x2="180" y2="230" stroke="#334155" stroke-width="3" />

      <!-- Crank Circle / Pedal Trajectory (Cyan Dash) -->
      <circle cx="180" cy="230" r="48" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 4" />
      
      <!-- Biomechanical Skeleton Bones (Vibrant Cobalt & Emerald) -->
      <!-- Torso -->
      <line x1="170" y1="85" x2="250" y2="110" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
      <!-- Arm -->
      <line x1="250" y1="110" x2="275" y2="165" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" />
      <line x1="275" y1="165" x2="310" y2="140" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" />
      <!-- Thigh (Hip to Knee) -->
      <line x1="170" y1="85" x2="195" y2="180" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
      <!-- Shin (Knee to Ankle at BDC) -->
      <line x1="195" y1="180" x2="180" y2="275" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
      <!-- Foot (Ankle to Toe) -->
      <line x1="180" y1="275" x2="215" y2="285" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

      <!-- Joint Markers (White with Glow Ring) -->
      <circle cx="170" cy="85" r="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
      <circle cx="250" cy="110" r="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
      <circle cx="275" cy="165" r="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
      <circle cx="310" cy="140" r="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
      
      <circle cx="195" cy="180" r="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" />
      <circle cx="180" cy="275" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
      <circle cx="215" cy="285" r="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" />

      <!-- Dynamic Angle Arcs -->
      <path d="M 195 160 A 20 20 0 0 1 185 200" fill="none" stroke="#10B981" stroke-width="2" />
      <text x="215" y="185" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981">143.1°</text>
    </g>

    <!-- Floating HUD Chips (Top Left) -->
    <g transform="translate(18, 18)">
      <rect width="130" height="30" rx="8" fill="rgba(9,12,18,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <circle cx="14" cy="15" r="3.5" fill="#10B981" />
      <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Knee BDC: <tspan fill="#10B981" font-weight="700">143.1°</tspan></text>

      <rect x="138" width="105" height="30" rx="8" fill="rgba(9,12,18,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <circle cx="152" cy="15" r="3.5" fill="#3B82F6" />
      <text x="164" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Hip: <tspan fill="#3B82F6" font-weight="700">51.6°</tspan></text>
    </g>

    <!-- Floating HUD Chips (Top Right) -->
    <g transform="translate(630, 18)">
      <rect width="115" height="30" rx="8" fill="rgba(9,12,18,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="12" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Cadence: <tspan fill="#F59E0B" font-weight="700">90 RPM</tspan></text>

      <rect x="123" width="115" height="30" rx="8" fill="rgba(9,12,18,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="12" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" transform="translate(123,0)">KOPS: <tspan fill="#F8FAFC" font-weight="700">-30 mm</tspan></text>
    </g>

    <!-- Scrubber Toolbar -->
    <g transform="translate(0, 436)">
      <rect width="888" height="48" rx="12" fill="#0E121A" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
      
      <!-- Controls -->
      <g transform="translate(14, 11)">
        <circle cx="13" cy="13" r="13" fill="#141924" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <polygon points="11,8 11,18 18,13" fill="#FFFFFF" />

        <text x="40" y="17" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">00:02.14 / 00:06.00</text>
      </g>

      <!-- Scrubber Track & Milestone Ticks -->
      <g transform="translate(230, 21)">
        <rect width="490" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
        <rect width="210" height="6" rx="3" fill="#2563EB" />
        <circle cx="210" cy="3" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
        
        <!-- Phase ticks -->
        <circle cx="0" cy="3" r="2" fill="#64748B" />
        <circle cx="120" cy="3" r="2" fill="#64748B" />
        <circle cx="245" cy="3" r="2" fill="#64748B" />
        <circle cx="370" cy="3" r="2" fill="#64748B" />
      </g>

      <g transform="translate(740, 15)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">Frame 34 / 89</text>
      </g>
    </g>

    <!-- Bottom Inspector: Dynamic Gauges & Prescriptions -->
    <g transform="translate(0, 502)">
      <!-- Left: Kinematics Gauges -->
      <g transform="translate(0, 0)">
        <rect width="434" height="186" rx="14" fill="#0E121A" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
        <text x="18" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.06em">DYNAMIC KINEMATICS</text>
        <text x="416" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="end">Medians</text>
        
        <!-- Gauge 1: Knee Extension -->
        <g transform="translate(18, 38)">
          <rect width="398" height="42" rx="8" fill="#0B0E15" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <text x="10" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Knee Extension (BDC)</text>
          <text x="340" y="17" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">143.1°</text>
          <rect x="355" y="6" width="35" height="15" rx="4" fill="rgba(16,185,129,0.15)" />
          <text x="372" y="17" font-family="sans-serif" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">OK</text>
          
          <rect x="10" y="26" width="378" height="5" rx="2.5" fill="rgba(255,255,255,0.08)" />
          <rect x="150" y="26" width="100" height="5" rx="2.5" fill="rgba(16,185,129,0.3)" />
          <circle cx="185" cy="28.5" r="5" fill="#FFFFFF" />
        </g>

        <!-- Gauge 2: Hip Closed -->
        <g transform="translate(18, 86)">
          <rect width="398" height="42" rx="8" fill="#0B0E15" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <text x="10" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Hip Closed Angle</text>
          <text x="340" y="17" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">51.6°</text>
          <rect x="355" y="6" width="35" height="15" rx="4" fill="rgba(16,185,129,0.15)" />
          <text x="372" y="17" font-family="sans-serif" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">OK</text>

          <rect x="10" y="26" width="378" height="5" rx="2.5" fill="rgba(255,255,255,0.08)" />
          <rect x="130" y="26" width="120" height="5" rx="2.5" fill="rgba(16,185,129,0.3)" />
          <circle cx="190" cy="28.5" r="5" fill="#FFFFFF" />
        </g>

        <!-- Gauge 3: Torso -->
        <g transform="translate(18, 134)">
          <rect width="398" height="42" rx="8" fill="#0B0E15" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <text x="10" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Torso Angle</text>
          <text x="340" y="17" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">35.2°</text>
          <rect x="355" y="6" width="35" height="15" rx="4" fill="rgba(239,68,68,0.15)" />
          <text x="372" y="17" font-family="sans-serif" font-size="9" font-weight="600" fill="#EF4444" text-anchor="middle">FIX</text>

          <rect x="10" y="26" width="378" height="5" rx="2.5" fill="rgba(255,255,255,0.08)" />
          <rect x="70" y="26" width="110" height="5" rx="2.5" fill="rgba(16,185,129,0.3)" />
          <circle cx="230" cy="28.5" r="5" fill="#FFFFFF" />
        </g>
      </g>

      <!-- Right: Prescriptions & Coach -->
      <g transform="translate(454, 0)">
        <rect width="434" height="186" rx="14" fill="#0E121A" stroke="rgba(255,255,255,0.07)" stroke-width="1" />
        <text x="18" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.06em">FIT RECOMMENDATIONS</text>
        <text x="416" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3B82F6" text-anchor="end">Google Gemini 2.5</text>

        <!-- Prescription 1 -->
        <g transform="translate(18, 38)">
          <rect width="398" height="60" rx="8" fill="#121622" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
          <rect x="10" y="10" width="22" height="16" rx="4" fill="#17223B" />
          <text x="21" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">P1</text>
          <text x="38" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Reach looks short (+10 mm stem recommended)</text>
          <text x="10" y="44" font-family="sans-serif" font-size="10" fill="#94A3B8">Shoulder angle 68° (target 80–100°). Extending aerobar pads will relieve shoulder tension.</text>
        </g>

        <!-- Prescription 2 -->
        <g transform="translate(18, 106)">
          <rect width="398" height="60" rx="8" fill="#121622" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
          <rect x="10" y="10" width="22" height="16" rx="4" fill="#17223B" />
          <text x="21" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">P2</text>
          <text x="38" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Torso position is more upright than typical (35°)</text>
          <text x="10" y="44" font-family="sans-serif" font-size="10" fill="#94A3B8">Fine for endurance comfort — for TT aero gains, lower aerobar stack 5–10 mm at a time.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
